# Live Map Leads: Public API (v1)
#
# SINGLE SOURCE OF TRUTH for the public /api/v1 surface (Phase 24.2).
# Hand-authored, spec-first: the route handlers in src/app/api/v1/** and every
# connector client (Activepieces / Zapier / n8n) are written/generated to MATCH
# this file; it is NOT route-derived. Pick one direction to avoid drift; this
# is the direction. Served verbatim at GET /api/v1/openapi.yaml.
#
# Scope: Phase 24.2 shipped the two operations the polling connector needs (start a
# search, list completed searches). Phase 41 (`D-v2-api-launch-scope`) completes it for
# the v2 launch: plan step 41.2 adds the add-ons and their options to POST /jobs, under
# public names mapped to the internal ones in src/app/api/v1/jobs/route.schema.ts, and
# POST /jobs/estimate (estimateSearch), which runs the start's own checks and quotes the
# search without starting it. Plan step 41.3 adds one search in any state (GET /jobs/{id},
# getSearch), every search in any state, paged by an opaque cursor (GET /jobs/history,
# listSearchHistory), and a cancel (POST /jobs/{id}/cancel, cancelSearch). Plan step 41.5
# adds webhooks: list, create, read, change, delete and test them (/webhooks...), send a
# finished search's event again (POST /jobs/{id}/deliver, redeliverSearch), `deliverTo` on
# a start, and the event itself under the root `webhooks` entry.
#
# `categories` is modelled as a plain string[] (NOT an inline 4,036-value enum):
# the list is versioned with the data provider and single-sourced in the
# app's vendored category list, so inlining it here would fork that source and
# bloat both the spec and the generated TS union. A connector category PICKER
# reads GET /categories (listCategories, plan step 41.6), served live from that
# same list, so every value it returns is one POST /jobs accepts.
#
# Money path is UNCHANGED (decisions #2/#11 not reopened): POST /api/v1/jobs
# reuses the EXACT internal job-start path (handleStartJob): budget cap, the
# running-search slots, Fair-Play limits, cancel/stall, and charge-on-success
# settlement are all inherited. Credits are reserved ASYNCHRONOUSLY by the
# ExtractionWorkflow's reserve step (decision #7). Plan step 36.19
# (`D-parallel-searches`, ruled 2026-10-17): up to three searches run at once per
# account, at most one heavy; a valid+authed POST returns 202, 409
# (too_many_running_searches) when the account's running searches leave no room,
# 402 (insufficient_credits) when the free credits cannot start it, or, with an
# Idempotency-Key, the first search again (202) or 422 for a reused key. A start
# that races past those checks still surfaces as a job with status "failed".
#
# Credit unit on v2 (this file lives on `main`, the v2 line): decision #1 was
# reopened for v2 by `D-credit-unit-rederived` (plan step 34.8,
# .agents/rules/stack-decisions.md § 1) and repriced by `D-v2-uniform-record-price`
# (2026-10-08), then `D-v2-one-credit-per-business` (2026-11-10): one credit buys one
# business record again, as on v1, and some add-ons cost half a credit; a search's total
# is rounded down to a whole credit, and a search whose exact total is above 0 is charged
# at least 1 credit, so `capCredits` and `creditsCharged` stay integers.
# Add-ons still mean `creditsCharged` can differ from `recordCount`.
# The frozen `v1` branch keeps 1 credit = 1 record. Schema shapes are unchanged.
#
# This file is served unauthenticated, comments included, so it names no data
# vendor and no sourcing route (plan step 35.9, `D-v2-sourcing-secrecy`);
# scripts/check-bundle-secrecy.ts scans it in CI.
#
# Compatibility on v2 (plan step 34.11, `D-v2-api-compat`): this contract only ever
# gains things. src/lib/api/v1-contract.test.ts compares this file against a frozen copy
# of the spec the v1 line publishes (src/lib/api/contract-baseline/) and fails on any
# removed or renamed path, operation, parameter, field, status code, header or error
# code, a new required input, a narrowed input or a widened output. A NEW response
# status is reported too and must be listed there as an accepted exception (today only
# the POST /jobs 409, 402 and 422, which a v1-line client never received). The credit unit is
# carried by an additive NOTE (info.description "Credit amounts"), not by a version
# field: v1 balances never move to v2, so no v2 account ever holds credits of both
# sizes, and a constant field would tell a client nothing per response. Why, in full:
# the 34.11 PR. info.version moved 1.0.0 -> 1.1.0 for the additive 409 and that note, and
# 1.1.0 -> 1.2.0 for plan step 36.19 (running searches side by side, the 402, the optional
# Idempotency-Key request header and its 422, and the Idempotent-Replayed response header),
# and 1.2.0 -> 1.3.0 for `D-v2-one-credit-per-business` (a credit buys twice what it did on
# 1.2.0; the "Credit amounts" note says so), and 1.3.0 -> 1.4.0 for plan step 41.1
# (`D-v2-api-launch-scope`: key permissions and the 403, and the RateLimit-* headers), and
# 1.4.0 -> 1.5.0 for plan step 41.2 (the add-ons and their options on POST /jobs, the
# personal-data attestation, the `add_on_unavailable_in_area` error code, and
# POST /jobs/estimate), and 1.5.0 -> 1.6.0 for plan step 41.3 (getSearch, listSearchHistory and
# cancelSearch, the `Search` schema with its public lifecycle, the `not_found`,
# `already_finished`, `not_started` and `too_late` error codes, and the cause sentence an
# `incomplete` search's `summary` now carries), 1.6.0 -> 1.7.0 for plan step 41.4 (getAccount:
# the account's free, held and total credits, its running searches against the running places,
# and the calling key's name and permission; read-only keys can now be created, up to five
# named keys an account), 1.7.0 -> 1.7.1 for issue #1220 (getSearch and cancelSearch say
# that a search whose run never starts stays `queued`, may hold credits until support clears it,
# and should be read before it is started again; descriptions only), and 1.7.1 -> 1.8.0 for plan
# step 41.5 (webhooks through the API, `deliverTo` on a start, the event documented under the root
# `webhooks` entry, and the `unknown_webhook`, `webhook_limit_reached`, `not_finished`,
# `nothing_to_deliver` and `export_expired` error codes). The root
# `webhooks` entry is an accepted exception in the comparator (it reads no root key it does
# not know), so src/lib/api/generated/conformance.ts holds the event to the code instead.
# 1.8.0 -> 1.9.0 for plan step 41.6 (listCategories: GET /categories, the recognised business
# categories, searchable by word, with an ETag per answer and a 304 on If-None-Match).
# 1.9.0 -> 1.10.0 for plan step 41.7 (previewSearchRecords: GET /jobs/{id}/records, the first
# records of a finished search's JSON download, read within stated size bounds).
# 1.10.0 -> 1.11.0 for plan step 41.8 (documentation only: a Categories tag for
# listCategories, a contact email, and `externalDocs` naming the API reference page; the spec
# is also served as JSON at GET /api/v1/openapi.json, and CI lints it with Redocly's
# `recommended` ruleset, scripts/lint-openapi.sh).
# 1.11.0 -> 1.11.1 for plan step 41.9 (documentation only: examples for Account, Webhook,
# WebhookCreated's and WebhookUpdated's secret, WebhookTestResult, RecordPreview, Redelivery, SearchHistory's cursor and
# WebhookTestEvent, which the API reference page shows as example answers).
# 1.11.1 -> 1.11.2 at the Phase 41 close (documentation only: an UpdateWebhookRequest example,
# so the reference page's example request sends a field instead of an empty body).
# No add-on description carries a price: each says what it is
# charged for, and estimateSearch quotes the figures. The Billing section states the
# only prices in the spec (1 credit a record; some add-ons half a credit).

openapi: 3.1.0
info:
  title: Live Map Leads API
  version: "1.11.2"
  summary: Start local-business searches and collect their results programmatically.
  description: |
    Pull filtered local-business lists from map data and download them as CSV,
    XLSX, or JSON, from your own code or a no-code automation platform
    (Activepieces, Zapier, n8n, Make).

    **Authentication.** Every request needs your API key in the `x-api-key`
    header. Create and revoke keys in your account settings: an account can
    hold up to five keys, each with a name and a permission. A key acts on
    behalf of the account that created it, so keep it secret.

    **Permissions.** A full key may read and change everything its account
    owns, including starting searches, which spend credits. A read-only key
    may read results and the account but never start a search or change
    anything. A request that needs a permission the key does not hold is
    refused with `403` and `error: "forbidden"`. `GET /account` says which
    permission the calling key has.

    **Rate limits.** Each key may make 60 requests a minute. Every response to
    an authenticated request carries `RateLimit-Limit`, `RateLimit-Remaining`
    and `RateLimit-Reset` for that per-key limit. A request refused with `401`
    or `403` at the key check is answered before the limit is counted and
    carries none (a key revoked while its request is in flight may be refused
    after it, with them), as does
    a `500` answered when the limit itself could not be checked. Several
    requests from one key within the same second can be refused with `429`
    before that minute's 60 are used: such an answer carries `Retry-After: 1`
    and `RateLimit-Remaining: 0`, so wait a second and retry. Starting
    searches has a second limit: 20 a minute per account, across all of its
    keys, and so has cancelling them: 10 a minute per account. Sending a
    search's event again is limited to 10 a minute per account, and creating,
    changing, deleting and testing webhooks to 30 a minute per account. Over any of those limits the answer is `429` with `Retry-After`, the seconds
    to wait for the limit that refused the request; the `RateLimit-*` headers
    still describe the per-key limit.

    **How it works.** Searches run in the background. `POST /jobs` starts one and
    returns immediately with a `jobId` and `status: "queued"`. Poll
    `GET /jobs?status=completed&since=<timestamp>` to pick up searches as they
    finish; each finished search carries ready-to-use download links.
    `POST /jobs/estimate` takes the same body as `POST /jobs` and tells you
    the most a search can hold and charge before you start it, and
    `GET /account` tells you your free credits and whether a running place
    is open. `GET /categories` lists the business categories a search can
    be narrowed to. `GET /jobs/{id}/records` shows the first records of a
    finished search without downloading it.

    **Learning how a search ended.** `GET /jobs?status=completed` lists only
    the searches that finished and delivered. For a search you started, poll
    `GET /jobs/{id}` until its `status` is no longer `queued` or `running`; it
    then says whether the search completed, was cancelled or failed, and why.
    To find searches whose ids you did not keep, including failed and cancelled
    ones, page `GET /jobs/history`. `POST /jobs/{id}/cancel` asks a running
    search to stop.

    **Webhooks.** Instead of polling, you can have a finished search sent to
    your own URL. Create a webhook with `POST /webhooks`: it answers once
    with the webhook's signing secret, so keep it. When a search finishes
    and delivers its results, every enabled webhook whose `deliveryMode` is
    `always` receives a signed `extraction.completed` event (see the
    `searchCompleted` webhook), and so does every webhook a start names in
    `deliverTo`. A webhook created with `deliveryMode: "ask"` fires only for
    the searches that name it. A failed delivery is not retried: send the
    event again with `POST /jobs/{id}/deliver`, or read the search with
    `GET /jobs/{id}`. A search that fails sends no event, so poll a search
    you started. `POST /webhooks/{id}/test` sends a test event so you can
    check your endpoint.

    **Billing.** You are charged only for records actually returned
    (charge-on-success), never for a search that fails. Each business record
    costs 1 credit, plus any add-ons you switch on (some cost half a credit),
    so the credits a search uses are not always the same number as the
    records it returns. A search's total is rounded down to a whole credit,
    and a search whose exact total is above 0 is charged at least 1 credit. Credits are reserved
    when the search runs, not when you call `POST /jobs`. A search with
    `capCredits` holds at most that many while it runs; a search without one
    holds every credit you have free, so set `capCredits` to run searches side
    by side. A request your free credits cannot start is rejected with `402`
    and `error: "insufficient_credits"`; one that passes that check and then
    cannot start completes with `status: "failed"` and uses no credits.

    **Credit amounts.** `capCredits` and `creditsCharged` are counted in the
    same credits you buy, where one business record costs 1 credit, as on the
    earlier version of Live Map Leads. Version 1.2.0 of this API counted in
    a credit half that size (2 per record); a `capCredits` written for it now
    allows about twice as many records, so halve it to keep the same limit.
  contact:
    name: Live Map Leads Support
    url: https://livemapleads.com/support
    email: support@livemapleads.com
  license:
    name: Proprietary
    url: https://livemapleads.com/terms

# Production is the apex from the v2 launch (plan step 34.13, cutover § 3 row A), merged and
# deployed at the cutover's step 7; before that it was the pre-launch host
# https://v2.livemapleads.com/api/v1, while the apex served the frozen v1 line.
servers:
  - url: https://livemapleads.com/api/v1
    description: Production
  - url: https://staging.livemapleads.com/api/v1
    description: Staging (gated by Cloudflare Access)

security:
  - ApiKeyAuth: []

externalDocs:
  description: API reference, with an example request and response for each operation
  url: https://livemapleads.com/en/developers

tags:
  - name: Searches
    description: Start searches and collect their results.
  - name: Account
    description: Your credits, your running searches, and the key you are calling with.
  - name: Webhooks
    description: Have finished searches sent to your own URL.
  - name: Categories
    description: The business categories a search can be narrowed to.

paths:
  /jobs:
    post:
      operationId: startSearch
      tags: [Searches]
      summary: Start a search
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: >
            Optional. 1 to 255 visible ASCII characters; a UUID per search you
            mean to start is the usual choice. A repeat within 24 hours with the
            same key and body returns the first search instead of starting another.
          schema:
            type: string
            minLength: 1
            maxLength: 255
            pattern: "^[\\x21-\\x7E]+$"
      description: |
        Start a new local-business search. Returns immediately with a `jobId`
        and `status: "queued"`; the search runs in the background. Watch for it
        to finish via `GET /jobs?status=completed&since=…`.

        Provide a location as **exactly one** of `locationQuery` (text) or
        `customGeolocation` (a drawn area). One is required, and supplying both
        is rejected.

        **Add-ons.** Switch on extra data with `addOns` (emails and social links
        from each business's website, decision-maker leads, verified emails,
        social profiles, reviews, photos, extra details) and tune it with the
        options beside it. Each add-on costs credits on top of the business
        record, charged only for what it delivers; `POST /jobs/estimate`
        quotes a search with its add-ons before you start it. Add-ons that
        collect personal contact data need `personalDataAttestation: true`;
        without it the request is rejected with `400` and
        `error: "invalid_request"`.

        **Coverage.** Searches for businesses in the EU, the EEA (including
        Norway, Iceland and Liechtenstein) or the United Kingdom are not supported
        and are rejected with `400` and `error: "location_not_supported"`, and so,
        because of local data protection laws, are searches for businesses in the
        Democratic Republic of the Congo, Vietnam, Serbia, Albania, Monaco, Gibraltar,
        the Isle of Man, the Faroe Islands, New Caledonia, French Polynesia, Wallis and
        Futuna, Saint-Pierre-et-Miquelon, Saint-Barthélemy or the French Southern and
        Antarctic Lands, and, because of international sanctions, searches for
        businesses in Iran, North Korea, Crimea, or the Donetsk, Luhansk, Kherson and
        Zaporizhzhia regions of Ukraine (those four regions in full). This is
        decided by where the searched area or place is, never by where your account
        is. A `customGeolocation` that reaches into one of those countries or
        regions anywhere is rejected too, even if most of it lies outside; adjust the area and retry.
        Searches for businesses in Cuba are accepted, but not with every option: a
        search that reaches Cuba and uses an option not available there (some
        add-ons and filters, or a `locationQuery` that resolves to a single point
        rather than an area) is rejected with `400` and
        `error: "location_not_supported"`, and its `message` says what to change.
        A location that cannot be placed in any country is rejected with
        `error: "location_not_resolved"`, and a temporary failure to check a text
        location returns `503` with `error: "location_check_unavailable"` (safe to
        retry). A search that reaches a country whose data protection law does
        not allow named people (decision-maker leads, verified emails or
        reviewer names) is rejected with `400` and
        `error: "add_on_unavailable_in_area"` when it asks for one of them: turn
        that add-on off and retry the same area. A rejected search starts
        nothing and uses no credits.

        **Searches running at once.** Up to three of your searches can run at
        the same time, and at most one of them can collect emails or extra
        details. A search beyond that is rejected with `409` and
        `error: "too_many_running_searches"`. Nothing is started and no credits
        are used; start it again once one of the running searches has finished.
        Nothing is queued for you.

        **Free credits.** A search without `capCredits` holds every credit you
        have free while it runs. If your free credits cannot start a new search,
        it is rejected with `402` and `error: "insufficient_credits"`, with
        nothing started. Set `capCredits` on your searches to run them side by
        side.

        **Retrying safely.** Send an `Idempotency-Key` header (a new UUID per
        search you mean to start) to make a retry safe. For 24 hours, a request
        with the same key and the same body returns the first search's `jobId`
        with `202` and the `Idempotent-Replayed: true` header, and starts
        nothing. The same key with a different body is rejected with `422` and
        `error: "idempotency_key_reused"`. A request that was rejected, for
        example with `409` or `402`, does not use up its key.

        **Terms of Service.** The account holder must have accepted the current
        Terms of Service in the app. Until they do, a search is rejected with
        `403` and `error: "terms_not_accepted"`, with nothing started. When we
        change the Terms in a way that needs agreement, the holder is asked to
        accept again the next time they open the app; an API key cannot accept
        on their behalf.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartSearchRequest"
      responses:
        "202":
          description: >
            Search accepted and queued, or, for a repeat of an earlier request with
            the same Idempotency-Key and body, that earlier search.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
            Idempotent-Replayed:
              description: >
                "true" when this response repeats an earlier request's search
                (same Idempotency-Key and body); absent on a new search.
              schema:
                type: string
                enum: ["true"]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartSearchResponse"
        "400":
          $ref: "#/components/responses/StartSearchBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/InsufficientCredits"
        "403":
          $ref: "#/components/responses/StartSearchForbidden"
        "409":
          $ref: "#/components/responses/SearchAlreadyRunning"
        "422":
          $ref: "#/components/responses/IdempotencyKeyReused"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/LocationCheckUnavailable"
    get:
      operationId: listSearches
      tags: [Searches]
      summary: List completed searches
      description: |
        List the calling account's completed searches, newest first, each with
        its result count and download links. Only the calling account's own
        searches are ever returned; no other account's identifiers are exposed.
        This is the polling source for a "New search completed" automation
        trigger.

        A search that delivered results but could not cover all of the requested
        area is listed too, with `status: "incomplete"`. It was charged only for
        the records it delivered.

        For incremental polling, pass `since` = the most recent `completedAt` you
        have already seen; the response returns only searches that finished
        strictly after it, ordered by `completedAt` descending. De-duplicate by
        the stable `jobId`. See `hasMore` for the rare case where a single page
        does not cover everything since `since`.
      parameters:
        - name: status
          in: query
          required: false
          description: |
            Lifecycle filter. v1 supports only `completed` (the value a polling
            trigger needs); it is also the default. It returns every finished
            search that delivered results: items with `status: "completed"` and,
            where part of the requested area could not be covered, items with
            `status: "incomplete"`.
          schema:
            type: string
            enum: [completed]
            default: completed
        - name: since
          in: query
          required: false
          description: >
            Return only searches that completed strictly after this RFC 3339
            timestamp. Omit on the first poll.
          schema:
            type: string
            format: date-time
          example: "2026-06-12T00:00:00Z"
        - name: limit
          in: query
          required: false
          description: Maximum number of searches to return.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: A page of completed searches, newest first.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ListForbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /jobs/estimate:
    post:
      operationId: estimateSearch
      tags: [Searches]
      summary: Estimate a search before starting it
      description: |
        Quote a search without starting it. Send the same body you would send
        to `POST /jobs`. The search goes through the same checks, so a body
        `POST /jobs` would reject is rejected here with the same `error`, and a
        text location is resolved the same way. Nothing is started, held or
        charged.

        The answer is a ceiling, not a price. `maxCreditsCharged` is the most
        the search can charge, and `maxCreditsHeld` the most it holds while it
        runs (your `capCredits`, or all your free credits without one). A
        search is charged only for what it delivers, so it usually costs less.
        Your free credits and running searches can change before you start it,
        and `POST /jobs` decides again when you do.

        Needs the `searches:write` permission, the same as starting a search.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartSearchRequest"
      responses:
        "200":
          description: The estimate for this search.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchEstimate"
        "400":
          $ref: "#/components/responses/StartSearchBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/InsufficientCredits"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/SearchAlreadyRunning"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/LocationCheckUnavailable"

  /jobs/history:
    get:
      operationId: listSearchHistory
      tags: [Searches]
      summary: List every search, in any state
      description: |
        List the calling account's searches in every state (queued, running,
        completed, incomplete, cancelled and failed), newest created first,
        each as the same `Search` that `GET /jobs/{id}` returns. Only the
        calling account's own searches are ever returned.

        Pages are ordered by when each search was created, never by when it
        finished, and are linked by `cursor`: pass the `nextCursor` of one page
        to get the next, and stop when `nextCursor` is null. A search created
        while you page through the list sorts first, so it never shifts the
        later pages and no search appears twice or is skipped; read the first
        page again to see new searches.

        Use it to learn how searches ended when you did not keep their ids, or
        to find failed and cancelled searches, which `GET /jobs?status=completed`
        never lists. Filter with `status`, which may be repeated
        (`?status=failed&status=cancelled`).
      parameters:
        - name: status
          in: query
          required: false
          description: >
            Only searches in these states. Repeat it for more than one; leave it
            out for every state.
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/SearchStatus"
        - name: limit
          in: query
          required: false
          description: Maximum number of searches to return.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          required: false
          description: >
            The `nextCursor` of the previous page, passed back unchanged. Leave it
            out to start from the newest search. A cursor this API did not return
            is rejected with `400`.
          schema:
            type: string
            maxLength: 200
      responses:
        "200":
          description: A page of searches, newest created first.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchHistory"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ListForbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /jobs/{id}:
    get:
      operationId: getSearch
      tags: [Searches]
      summary: Get one search
      description: |
        Read one of your searches in any state: what it asked for, how far it
        has got while it runs, and how it ended once it has.

        **Learning how a search ended.** For a search you started, poll this
        until `status` is no longer `queued` or `running`. Every 30 seconds is
        plenty: `progress.usualMinutes` says how long a search like it usually
        takes. Then read `status`: `completed` and `incomplete` carry
        `downloads`, `cancelled` says in `cancelRefundsInFull` and `recordCount`
        what it kept, and `failed` carries `failure`. To find searches whose ids
        you did not keep, page `GET /jobs/history`.

        **A search that never starts.** A search normally leaves `queued`
        within a few minutes. Rarely, its run never starts and it stays
        `queued`: cancelling it answers `409` with `not_started`, and a retry
        with the same `Idempotency-Key` returns this same search. A daily
        check flags such searches for support to clear, which ends them as
        `failed`. Until then it may still hold credits, so do not count on
        them being free. Before you start the search again with a new
        `Idempotency-Key`, read the original here, so you do not run the same
        search twice.

        Another account's search and an id that matches no search both answer
        `404` with `error: "not_found"`; an id that is not a search id answers
        `400`.
      parameters:
        - $ref: "#/components/parameters/SearchId"
      responses:
        "200":
          description: The search.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Search"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ListForbidden"
        "404":
          $ref: "#/components/responses/SearchNotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /jobs/{id}/cancel:
    post:
      operationId: cancelSearch
      tags: [Searches]
      summary: Cancel a running search
      description: |
        Ask one of your running searches to stop. A `202` means the request was
        accepted, not that the search has stopped: the answer is the search as
        it reads right after, usually still `running` with
        `cancelRequested: true`, or already ended if it finished in that
        moment. Read it with `GET /jobs/{id}` for the outcome.

        **What a cancel costs.** It depends on the search, and
        `cancelRefundsInFull` says which before you cancel. When it is `false`,
        a cancelled search keeps what it already found: it delivers those
        records and is charged for them as usual, and ends `cancelled` with its
        `recordCount`, `creditsCharged` and `downloads`. When it is `true`, a
        cancelled search delivers nothing and every credit it held is released.
        A search that finishes before the cancel takes effect ends as usual
        and is charged for what it delivers.

        Cancelling a search that is already stopping answers `202` again and
        changes nothing. A search that cannot be cancelled answers `409`:
        `already_finished` (it has ended), `not_started` (it has not started
        running yet; retry in a moment. A search that stays `queued` may
        never start: see "A search that never starts" under `GET /jobs/{id}`),
        or `too_late` (it had finished, or is
        being charged and delivered, when the cancel arrived; it ends as
        usual). Cancelling has its own limit too: 10 a minute per account,
        across all of its keys.

        Needs the `searches:write` permission.
      parameters:
        - $ref: "#/components/parameters/SearchId"
      responses:
        "202":
          description: >
            The cancel was accepted. The search is stopping (or has just
            ended); read it later for the outcome.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Search"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/SearchNotFound"
        "409":
          $ref: "#/components/responses/CancelConflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /jobs/{id}/deliver:
    post:
      operationId: redeliverSearch
      tags: [Searches, Webhooks]
      summary: Send a finished search's event again
      description: |
        Send one of your finished searches' `extraction.completed` event again,
        to the webhooks you name. Use it when a delivery failed (a failed
        delivery is never retried on its own), or to send a search to a
        webhook created after it finished. Nothing is searched again and no
        credits are used.

        The event is the one the search sent when it finished, with fresh
        download links, `completedAt` set to this delivery, and
        `redelivered: true`. Each delivery carries a new `webhook-id`, so a
        receiver that de-duplicates on `webhook-id` treats it as a new event;
        one that must act once per search de-duplicates on `jobId`.

        Every named webhook must be one of yours (`400`,
        `error: "unknown_webhook"`, otherwise, whatever state the search is
        in). It is sent whatever its `deliveryMode`, `ask` included, but a
        paused one (`enabled: false`) receives nothing
        and is counted in neither `delivered` nor `failed`. A search that has
        not ended answers `409` with `not_finished`; one that ended without
        results to send (it failed, or was cancelled before it kept anything)
        answers `409` with `nothing_to_deliver`; one whose results are past the
        90 days they are kept answers `410` with `export_expired`. Another
        account's search and an id that matches no search both answer `404`.

        Needs the `searches:write` permission. Limited to 10 a minute per
        account, across all of its keys.
      parameters:
        - $ref: "#/components/parameters/SearchId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedeliverSearchRequest"
      responses:
        "200":
          description: The event was sent; the counts say how each webhook answered.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Redelivery"
        "400":
          $ref: "#/components/responses/WebhookBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/SearchNotFound"
        "409":
          $ref: "#/components/responses/RedeliverConflict"
        "410":
          $ref: "#/components/responses/ExportExpired"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /jobs/{id}/records:
    get:
      operationId: previewSearchRecords
      tags: [Searches]
      summary: Preview a finished search's records
      description: |
        The first records of one of your finished searches, as its JSON
        download has them, in the same order. Use it to look at results from
        a script or an agent without downloading the whole file. It is a
        preview, not a reader: there is no next page. For every record, use
        the search's `downloads`.

        **Size bounds.** A preview reads at most 16 MiB of the stored results,
        and returns at most 4 MiB of records (measured as stored). A record
        larger than 512 KiB (a business with hundreds of long reviews) is
        never cut: it is passed over and counted in `skipped`. When a bound
        stops the read before `limit` records or the end of the results,
        `truncated` is `true` and `records` holds the records read so far.

        A search that has not ended answers `409` with `not_finished`; one
        that ended without results (it failed, or was cancelled before it kept
        anything) answers `409` with `nothing_to_deliver`; one whose results
        are past the 90 days they are kept answers `410` with
        `export_expired`. Another account's search and an id that matches no
        search both answer `404` with `error: "not_found"`; an id that is not
        a search id, or a bad `limit`, answers `400`.

        Needs the `searches:read` permission.
      parameters:
        - $ref: "#/components/parameters/SearchId"
        - name: limit
          in: query
          required: false
          description: How many records to return, from 1 to 100. Defaults to 10.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        "200":
          description: The first records of the search.
          headers:
            Cache-Control:
              description: "`private, no-store`: the records hold contact details, so no cache keeps them."
              schema:
                type: string
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordPreview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ListForbidden"
        "404":
          $ref: "#/components/responses/SearchNotFound"
        "409":
          $ref: "#/components/responses/RecordsConflict"
        "410":
          $ref: "#/components/responses/RecordsExpired"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /webhooks:
    get:
      operationId: listWebhooks
      tags: [Webhooks]
      summary: List your webhooks
      description: |
        Every webhook on your account, newest first. Signing secrets are never
        shown here: only their last four characters, to tell them apart.

        Needs the `webhooks:read` permission.
      responses:
        "200":
          description: Your webhooks.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WebhooksReadForbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createWebhook
      tags: [Webhooks]
      summary: Create a webhook
      description: |
        Add a URL to send finished searches to. The answer carries the
        webhook's signing secret, shown this once: store it to verify the
        events (see the `searchCompleted` webhook). To replace it later, update
        the webhook with `rotateSecret: true`.

        The URL must be `https://` and reach a public address: a private,
        local or loopback address is rejected with `400`, and so is a domain
        that points to one or cannot be looked up. An account can have at most
        20 webhooks (`409`, `error: "webhook_limit_reached"`).

        Needs the `webhooks:write` permission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWebhookRequest"
      responses:
        "201":
          description: The webhook, and its signing secret (shown once).
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookCreated"
        "400":
          $ref: "#/components/responses/WebhookBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/WebhookLimitReached"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /webhooks/{id}:
    get:
      operationId: getWebhook
      tags: [Webhooks]
      summary: Get one webhook
      description: |
        One of your webhooks, without its signing secret. Another account's
        webhook and an id that matches none both answer `404`.

        Needs the `webhooks:read` permission.
      parameters:
        - $ref: "#/components/parameters/WebhookId"
      responses:
        "200":
          description: The webhook.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Webhook"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WebhooksReadForbidden"
        "404":
          $ref: "#/components/responses/WebhookNotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      operationId: updateWebhook
      tags: [Webhooks]
      summary: Change a webhook
      description: |
        Change any of a webhook's fields; leave out the ones to keep. A new
        `url` is checked exactly as on create, and nothing is changed when it
        is rejected. `rotateSecret: true` replaces the signing secret: the
        answer carries the new one, shown this once, and the old one stops
        signing at once. Set `enabled: false` to pause the webhook without
        deleting it.

        Needs the `webhooks:write` permission.
      parameters:
        - $ref: "#/components/parameters/WebhookId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWebhookRequest"
      responses:
        "200":
          description: The webhook as changed, and the new secret if this request rotated it.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookUpdated"
        "400":
          $ref: "#/components/responses/WebhookBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/WebhookNotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteWebhook
      tags: [Webhooks]
      summary: Delete a webhook
      description: |
        Delete one of your webhooks. It receives nothing more, including for
        searches already running that named it in `deliverTo`.

        Needs the `webhooks:write` permission.
      parameters:
        - $ref: "#/components/parameters/WebhookId"
      responses:
        "204":
          description: Deleted.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/WebhookNotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /webhooks/{id}/test:
    post:
      operationId: testWebhook
      tags: [Webhooks]
      summary: Send a test event
      description: |
        Send one signed `webhook.test` event (see the `webhookTest` webhook) to
        a webhook, paused or not, and report what its endpoint answered. Use it
        to check your endpoint and its signature check before a real search
        finishes. The URL is checked again before anything is sent.

        Needs the `webhooks:write` permission.
      parameters:
        - $ref: "#/components/parameters/WebhookId"
      responses:
        "200":
          description: >
            The test event was attempted. `delivered` says whether your endpoint
            accepted it.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookTestResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/WebhookNotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /account:
    get:
      operationId: getAccount
      tags: [Account]
      summary: Get your account
      description: |
        Read your credits, how many of your searches are running, and the
        name and permission of the key you are calling with. Nothing is
        changed.

        `credits.free` is what a new search can use now: your balance less
        what your running searches hold. Up to three searches run at once,
        and only one of them may collect emails or extra details: a start
        that would break either rule is refused with `409`, so check
        `runningSearches` first. The figures are read moments apart, so a
        search that starts or ends meanwhile can show in one and not yet the
        other; `POST /jobs` checks again when you start.

        Needs the `searches:read` permission, which every full and read-only
        key has.
      responses:
        "200":
          description: Your account.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ListForbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /categories:
    get:
      operationId: listCategories
      tags: [Categories]
      summary: List business categories
      description: |
        The business categories a search can be narrowed to with
        `categories` on `POST /jobs`. Every name returned here is one
        `POST /jobs` accepts, written exactly as it must be sent.

        Without `q`, the whole list comes back in one response (a few
        thousand short names), in no particular order; there are no pages.
        With `q`, only the categories whose name has a word starting with
        each word of `q` come back ("dent" finds "dentist" and "dental
        clinic"; "car rep" finds "car repair and maintenance service"),
        an exact name first. Matching ignores case and accents. A `q` with
        no letters or digits is the same as leaving it out. `limit` caps
        how many names come back; `total` still counts every match.

        The list is the same for every account and changes rarely. Each
        answer carries an `ETag` for that answer: it changes when the list
        does, and differs between values of `q` and `limit`. The answer may
        be stored by any cache, but every reuse must be checked here first
        (`Cache-Control: public, no-cache`): repeat the same request with
        its `ETag` in `If-None-Match` and, while the answer has not
        changed, you get `304` with no body. A `304` needs a valid key and
        counts against the rate limit like any other request.

        Needs the `searches:read` permission, which every full and read-only
        key has.
      parameters:
        - name: q
          in: query
          required: false
          description: >
            Words to look for at the start of words in a category's name. At
            most 100 characters (Unicode code points).
          schema:
            type: string
            maxLength: 100
        - name: limit
          in: query
          required: false
          description: The most names to return. Leave it out to get every match.
          schema:
            type: integer
            minimum: 1
            maximum: 5000
        - name: If-None-Match
          in: header
          required: false
          description: >
            The `ETag` of the answer you hold to this same request. While that
            answer is unchanged, you get `304` with no body.
          schema:
            type: string
      responses:
        "200":
          description: The matching categories.
          headers:
            ETag:
              $ref: "#/components/headers/CategoryListETag"
            Cache-Control:
              $ref: "#/components/headers/CategoryListCacheControl"
            Vary:
              $ref: "#/components/headers/CategoryListVary"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryList"
        "304":
          description: >
            The answer is unchanged since the `ETag` sent in `If-None-Match`.
            No body; keep using the answer you hold.
          headers:
            ETag:
              $ref: "#/components/headers/CategoryListETag"
            Cache-Control:
              $ref: "#/components/headers/CategoryListCacheControl"
            Vary:
              $ref: "#/components/headers/CategoryListVary"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ListForbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

# This document is itself served (unauthenticated) at GET /api/v1/openapi.yaml:
# see the header note. It is deliberately NOT modelled as an operation here: it is
# not a connector action, and listing it would emit a spurious `getOpenApiSpec`
# action in every generated client.

webhooks:
  searchCompleted:
    post:
      operationId: searchCompletedEvent
      tags: [Webhooks]
      # We send this to you: it carries no API key. The signature headers below are its proof.
      security: []
      summary: A search finished and delivered its results
      description: |
        Sent as a `POST` with a JSON body to each of your enabled webhooks whose
        `deliveryMode` is `always`, and to each one a start named in
        `deliverTo`, when a search finishes and delivers its results: it
        completed, delivered part of an area (`incomplete`), or was cancelled
        after it had found results it kept (`aborted`). A search that fails, or
        is cancelled before it keeps anything, sends no event: poll
        `GET /jobs/{id}` for a search you started.

        **Verifying it.** Every event is signed the Standard Webhooks way, so
        any Standard Webhooks library can check it with your secret. By hand:
        your secret starts with `whsec` and an underscore; base64-decode the
        rest to get the key. Compute the HMAC-SHA256, with that key, of
        `{webhook-id}.{webhook-timestamp}.{body}`, where the body is the raw
        request body exactly as received, and base64-encode it. It must equal
        the part of `webhook-signature` after `v1,`. Compare in constant time,
        and refuse an event whose `webhook-timestamp` is more than a few
        minutes from your clock.

        **Answering it.** Answer with any `2xx` status within 10 seconds. A
        redirect, any other status or no answer in time is a failed delivery,
        shown on the webhook (`lastDeliveryStatus`, `failureCount`). A failed
        delivery is not retried: send it again with `POST /jobs/{id}/deliver`,
        or read the search with `GET /jobs/{id}`.

        **Duplicates.** `webhook-id` stays the same if one automatic delivery
        reaches you twice, so de-duplicate on it. An event sent again with
        `POST /jobs/{id}/deliver` carries a new `webhook-id` and
        `redelivered: true`, so a receiver that must act once per search
        de-duplicates on `jobId`.

        **Download links** in the event work for 7 days after it is sent, and
        need no API key. For fresh links, read the search with
        `GET /jobs/{id}` while its results are kept (90 days).
      parameters:
        - name: webhook-id
          in: header
          required: true
          description: >
            The event's id. The same for every attempt of one automatic delivery
            to one webhook; new for every `POST /jobs/{id}/deliver` and every test.
          schema:
            type: string
        - name: webhook-timestamp
          in: header
          required: true
          description: When the event was signed, in Unix seconds.
          schema:
            type: string
        - name: webhook-signature
          in: header
          required: true
          description: >
            `v1,` followed by the base64 HMAC-SHA256 signature (Standard
            Webhooks). See the `searchCompleted` webhook for how to check it.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchCompletedEvent"
      responses:
        "2XX":
          description: Your endpoint accepted the event.
  webhookTest:
    post:
      operationId: webhookTestEvent
      tags: [Webhooks]
      # We send this to you: it carries no API key. The signature headers below are its proof.
      security: []
      summary: A test event
      description: |
        Sent once each time you call `POST /webhooks/{id}/test`, signed like
        `searchCompleted` with the same secret. It carries no search: use it to
        check your endpoint, its signature check, and the body's shape.
      parameters:
        - name: webhook-id
          in: header
          required: true
          description: >
            The event's id. The same for every attempt of one automatic delivery
            to one webhook; new for every `POST /jobs/{id}/deliver` and every test.
          schema:
            type: string
        - name: webhook-timestamp
          in: header
          required: true
          description: When the event was signed, in Unix seconds.
          schema:
            type: string
        - name: webhook-signature
          in: header
          required: true
          description: >
            `v1,` followed by the base64 HMAC-SHA256 signature (Standard
            Webhooks). See the `searchCompleted` webhook for how to check it.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookTestEvent"
      responses:
        "2XX":
          description: Your endpoint accepted the test event.

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: >
        Your account API key. Create or revoke keys in account settings. The key
        is shown once at creation and stored hashed, so keep a copy.

  parameters:
    SearchId:
      name: id
      in: path
      required: true
      description: The search's `jobId`, as its start returned it.
      schema:
        type: string
        format: uuid
    WebhookId:
      name: id
      in: path
      required: true
      description: The webhook's `id`, as its create returned it.
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: >
        The request body or query failed validation (e.g. unknown category, both
        location forms supplied, value out of range).
      headers:
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimit-Limit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimit-Remaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimit-Reset"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "invalid_request"
            message: "Provide exactly one of locationQuery or customGeolocation."
    StartSearchBadRequest:
      description: >
        The request failed validation, or the location is outside the countries
        the service covers. Branch on `error`: `invalid_request` (body, or the
        Idempotency-Key header, failed validation, including a personal-data
        add-on without `personalDataAttestation: true`), `location_not_supported` (the area or place is in, or reaches
        into, the EU, EEA or UK, a place refused for its data protection laws, or a
        sanctioned country or region, or it reaches Cuba with an option not available there),
        `location_not_resolved` (the location could not
        be placed in any country), `add_on_unavailable_in_area` (the search
        reaches a country where decision-maker leads, verified emails or
        reviewer names are not available: turn that add-on off, the area is
        fine), `unknown_webhook` (an id in `deliverTo` is not one of your
        webhooks).
      headers:
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimit-Limit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimit-Remaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimit-Reset"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            invalidRequest:
              value:
                error: "invalid_request"
                message: "Provide exactly one of locationQuery or customGeolocation."
            locationNotSupported:
              value:
                error: "location_not_supported"
                message: "This search area is in France. We don't cover businesses in the EU, EEA or UK yet, so choose a location in another country."
            locationNotResolved:
              value:
                error: "location_not_resolved"
                message: "We couldn't find that location. Check the spelling, or try a nearby city."
            addOnUnavailableInArea:
              value:
                error: "add_on_unavailable_in_area"
                message: "Decision-maker leads aren't available for searches that reach Australia, because of local data protection law. Turn them off and try again."
            attestationMissing:
              value:
                error: "invalid_request"
                message: "Set personalDataAttestation to true to confirm you have a lawful basis to collect and use personal contact data. addOns.websiteContacts, addOns.decisionMakerLeads, addOns.socialProfiles and reviewerNames collect it."
            unknownWebhook:
              value:
                error: "unknown_webhook"
                message: "Every id in deliverTo must be one of your webhooks. GET /webhooks lists them."
    SearchAlreadyRunning:
      description: >
        Your running searches leave no room for this one: three are running, or
        one that collects emails or extra details is running and this one would
        too (`too_many_running_searches`). `search_already_running` is kept for
        clients written against version 1.1.0. Nothing was started and no
        credits were used; start this search again once a running one has
        finished.
      headers:
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimit-Limit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimit-Remaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimit-Reset"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            tooManyRunningSearches:
              value:
                error: "too_many_running_searches"
                message: "You already have 3 searches running. Wait for one to finish, then start this one."
            searchAlreadyRunning:
              value:
                error: "search_already_running"
                message: "This search is already running. Wait for it to finish, then try again."
    InsufficientCredits:
      description: >
        Your free credits (your balance less what your running searches hold)
        cannot start this search. Nothing was started and no credits were used.
        Buy credits, wait for a running search to finish, or set `capCredits` on
        your searches so they hold less while they run.
      headers:
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimit-Limit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimit-Remaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimit-Reset"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "insufficient_credits"
            message: "This search needs at least 1 credit, and you have 0. Buy credits to start it."
    IdempotencyKeyReused:
      description: >
        The Idempotency-Key was already used in the last 24 hours for a request
        with a different body. Nothing was started; use a new key for a new
        search.
      headers:
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimit-Limit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimit-Remaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimit-Reset"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "idempotency_key_reused"
            message: "This request key was already used for a different search. Use a new key to start a new search."
    LocationCheckUnavailable:
      description: >
        The text location could not be checked against the covered countries just
        now. Nothing was started; retry shortly.
      headers:
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimit-Limit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimit-Remaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimit-Reset"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "location_check_unavailable"
            message: "We couldn't check that location just now. Try again in a minute."
    Unauthorized:
      description: Missing, invalid, or revoked API key.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "unauthorized"
            message: "Missing or invalid API key."
    Forbidden:
      description: >
        The key is valid but does not hold the permission this request needs,
        for example a read-only key starting a search. Answered before the rate
        limit is counted, so it carries no RateLimit headers.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "forbidden"
            message: "This API key does not have the searches:write permission this request needs."
    StartSearchForbidden:
      description: >
        Branch on `error`. `forbidden`: the key is valid but does not hold the
        searches:write permission (a read-only key); answered before the rate
        limit is counted, so it carries no RateLimit headers.
        `terms_not_accepted`: the account holder has not accepted the current
        Terms of Service; they accept in the app, then the search can be
        retried. Answered after the rate limit, so it carries RateLimit headers.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            forbidden:
              value:
                error: "forbidden"
                message: "This API key does not have the searches:write permission this request needs."
            termsNotAccepted:
              value:
                error: "terms_not_accepted"
                message: "The account holder has not accepted the current Terms of Service. Sign in to Live Map Leads, accept them, then retry."
    ListForbidden:
      description: >
        The key is valid but its stored permissions do not include reading
        searches. Every full and read-only key can read, so this answers only a
        key whose stored permissions are missing, malformed, or a custom set
        without `searches:read`. Answered before the rate limit is counted, so
        it carries no RateLimit headers.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "forbidden"
            message: "This API key does not have the searches:read permission this request needs."
    SearchNotFound:
      description: >
        No search with this id belongs to your account: it does not exist, or
        another account started it. The two are not told apart.
      headers:
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimit-Limit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimit-Remaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimit-Reset"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "not_found"
            message: "No search with this id belongs to your account."
    CancelConflict:
      description: >
        The search cannot be cancelled. Branch on `error`: `already_finished`
        (it has ended; read it for the outcome), `not_started` (it has not
        started running yet; retry in a moment), `too_late` (it had finished,
        or is being charged and delivered, when the cancel arrived; it ends as
        usual and is charged for what it delivers). Nothing was changed.
      headers:
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimit-Limit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimit-Remaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimit-Reset"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            alreadyFinished:
              value:
                error: "already_finished"
                message: "This search has already finished, so there is nothing to cancel. Read the search for its outcome."
            notStarted:
              value:
                error: "not_started"
                message: "This search hasn't started running yet, so it can't be cancelled yet. Try again in a moment."
            tooLate:
              value:
                error: "too_late"
                message: "This search had already finished when the cancel arrived, so it ends as usual and is charged for what it delivers."
    WebhookBadRequest:
      description: >
        The request failed validation. Branch on `error`: `invalid_request`
        (a field, or the URL, was rejected; the message says which) or
        `unknown_webhook` (an id in `webhookIds` is not one of your webhooks).
        Nothing was changed or sent.
      headers:
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimit-Limit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimit-Remaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimit-Reset"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            urlRefused:
              value:
                error: "invalid_request"
                message: "That address can't be used: private, local and loopback addresses are refused."
            notHttps:
              value:
                error: "invalid_request"
                message: "The URL must start with https://."
            unknownWebhook:
              value:
                error: "unknown_webhook"
                message: "Every id in webhookIds must be one of your webhooks. GET /webhooks lists them."
    WebhooksReadForbidden:
      description: >
        The key is valid but its stored permissions do not include reading
        webhooks. Every full and read-only key can read, so this answers only a
        key whose stored permissions are missing, malformed, or a custom set
        without `webhooks:read`. Answered before the rate limit is counted, so
        it carries no RateLimit headers.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "forbidden"
            message: "This API key does not have the webhooks:read permission this request needs."
    WebhookNotFound:
      description: >
        No webhook with this id belongs to your account: it does not exist, or
        another account created it. The two are not told apart.
      headers:
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimit-Limit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimit-Remaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimit-Reset"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "not_found"
            message: "No webhook with this id belongs to your account."
    WebhookLimitReached:
      description: >
        Your account already has 20 webhooks, the most it can have. Nothing was
        created; delete one to add another.
      headers:
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimit-Limit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimit-Remaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimit-Reset"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "webhook_limit_reached"
            message: "Your account already has 20 webhooks, the most it can have. Delete one to add another."
    RedeliverConflict:
      description: >
        There is nothing to send for this search. Branch on `error`:
        `not_finished` (it is still queued or running; try again once it has
        ended) or `nothing_to_deliver` (it ended without results to send: it
        failed, or was cancelled before it kept anything). Nothing was sent.
      headers:
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimit-Limit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimit-Remaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimit-Reset"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            notFinished:
              value:
                error: "not_finished"
                message: "This search hasn't finished yet, so there is nothing to send. Try again once it has ended."
            nothingToDeliver:
              value:
                error: "nothing_to_deliver"
                message: "This search ended without results to send: it failed, or was cancelled before it kept anything."
    ExportExpired:
      description: >
        The search's results are no longer kept (90 days after it finished), so
        there is nothing to send. Nothing was sent.
      headers:
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimit-Limit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimit-Remaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimit-Reset"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "export_expired"
            message: "This search's results have expired. Results are kept for 90 days after a search finishes."
    RecordsConflict:
      description: >
        There are no records to preview for this search. Branch on `error`:
        `not_finished` (it is still queued or running; try again once it has
        ended) or `nothing_to_deliver` (it ended without results: it failed,
        or was cancelled before it kept anything).
      headers:
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimit-Limit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimit-Remaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimit-Reset"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            notFinished:
              value:
                error: "not_finished"
                message: "This search hasn't finished yet, so it has no results to preview. Try again once it has ended."
            nothingToPreview:
              value:
                error: "nothing_to_deliver"
                message: "This search ended without results to preview: it failed, or was cancelled before it kept anything."
    RecordsExpired:
      description: >
        The search's results are no longer kept (90 days after it finished),
        so there is nothing to preview.
      headers:
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimit-Limit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimit-Remaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimit-Reset"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "export_expired"
            message: "This search's results have expired. Results are kept for 90 days after a search finishes."
    InternalError:
      description: >
        Something failed on our side while handling the request. Nothing about
        the failure is returned. Try again later. When the rate limit itself
        could not be checked, the response carries no RateLimit headers.
      headers:
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimit-Limit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimit-Remaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimit-Reset"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "internal_error"
            message: "Something went wrong on our side. Try again later."
    TooManyRequests:
      description: >
        Rate limit exceeded: this key's 60 requests a minute, or one of the
        account's own limits (20 starts, 10 cancels or 10 redeliveries a minute,
        or 30 webhook changes and tests a minute). Wait `Retry-After` seconds.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimit-Limit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimit-Remaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimit-Reset"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "rate_limited"
            message: "Too many requests. Retry after the indicated delay."

  headers:
    RateLimit-Limit:
      description: Requests this key may make in the current window.
      schema:
        type: integer
        minimum: 1
    RateLimit-Remaining:
      description: Requests this key has left in the current window.
      schema:
        type: integer
        minimum: 0
    RateLimit-Reset:
      description: Seconds until the current one-minute window resets.
      schema:
        type: integer
        minimum: 0
    CategoryListETag:
      description: >
        Identifies this answer: it changes when the category list does, and
        differs between values of `q` and `limit`. Send it back in
        `If-None-Match` on the same request to get a `304` while the answer
        is unchanged. It is not the body's `version`.
      schema:
        type: string
    CategoryListCacheControl:
      description: >
        `public, no-cache`: any cache may keep the list, but must check it
        here (with `If-None-Match`) before each reuse.
      schema:
        type: string
    CategoryListVary:
      description: >
        `x-api-key`: a cache keeps a separate copy for each key.
      schema:
        type: string

  schemas:
    StartSearchRequest:
      type: object
      required: [searchStrings]
      additionalProperties: false
      description: |
        Search definition, for `POST /jobs` and `POST /jobs/estimate`. Any field
        not listed here is rejected with `400`. Exactly one of `locationQuery` or
        `customGeolocation` is required. Every add-on is off unless you switch it
        on in `addOns`; an option left out takes its default, and an option for
        an add-on that is off changes nothing.
      properties:
        searchStrings:
          type: array
          description: >
            One or more search terms, e.g. "dentist" or "italian restaurant".
            Each term runs against the location. A term is at most 100
            characters after trimming, counted in UTF-16 code units (a
            character outside the Basic Multilingual Plane, such as an emoji,
            counts as two); a longer term is a 400.
          items:
            type: string
            minLength: 1
            maxLength: 100
          minItems: 1
          maxItems: 20
          example: ["dentist"]
        locationQuery:
          type: string
          description: >
            Free-text location, e.g. "Austin, TX" or "Lyon, France". Mutually
            exclusive with `customGeolocation`.
          minLength: 1
          maxLength: 200
          example: "Austin, TX"
        customGeolocation:
          $ref: "#/components/schemas/GeoArea"
        language:
          type: string
          description: Result language as a BCP-47 code.
          minLength: 2
          maxLength: 10
          default: "en"
        maxResults:
          type: integer
          description: Optional cap on the number of places returned per search term.
          minimum: 1
          maximum: 75000
        nameMatch:
          type: string
          description: >
            How a business name must match your search term. `all` = no name
            filter; `contains` = name contains the term; `exact` = name equals
            the term.
          enum: [all, contains, exact]
          default: all
        website:
          type: string
          description: >
            Filter by website presence. `any` = no filter; `with` = only places
            that have a website; `without` = only places that do not.
          enum: [any, with, without]
          default: any
        categories:
          type: array
          description: >
            Restrict results to these business categories, e.g. "dentist" or
            "art gallery". Values are lowercase and must each be a recognised
            category; an unknown value is rejected with 400. The recognised set
            is large (thousands of entries) and changes from time to time, so
            it is not enumerated inline here: `GET /categories` lists it, and
            can search it by word. Omit this field to apply no category filter.
          items:
            type: string
          uniqueItems: true
          maxItems: 50
        skipClosed:
          type: boolean
          description: Exclude permanently or temporarily closed places.
          default: false
        capCredits:
          type: integer
          description: >
            Optional per-search spending ceiling, in credits. The search stops
            before exceeding it. Recommended for unattended automations.
          minimum: 1
        addOns:
          $ref: "#/components/schemas/AddOns"
        maxEmailsPerBusiness:
          type: integer
          description: >
            With `addOns.websiteContacts`: the most website email addresses
            delivered, and charged, for each business.
          minimum: 1
          maximum: 10
          default: 3
        maxLeadsPerBusiness:
          type: integer
          description: >
            With `addOns.decisionMakerLeads`: how many decision-maker leads to
            find at each business. Each lead found is charged, so a higher number
            can cost much more; set `capCredits` too.
          minimum: 1
          maximum: 100
          default: 1
        searchInsideVenues:
          type: boolean
          description: >
            Also list businesses located inside malls and shopping centers. Each
            one found inside is a business record, charged like any other, so a
            search can return more businesses than the places it searched;
            `capCredits` still caps the total.
          default: false
        reviewsPerBusiness:
          type: integer
          description: >
            With `addOns.reviews`: the most reviews collected for each business.
            It sets the review charge for each business that has reviews (a
            higher number costs more), whatever the number that comes back.
          minimum: 1
          maximum: 100
          default: 10
        reviewsSort:
          type: string
          description: With `addOns.reviews`, which reviews come first.
          enum: [newest, relevant, highest, lowest]
          default: newest
        reviewsSource:
          type: string
          description: >
            With `addOns.reviews`: reviews from all sources, or from Google only.
          enum: [all, google]
          default: all
        reviewsSince:
          type: string
          description: >
            With `addOns.reviews`: only reviews since a date (`2026-01-01`) or for
            a recent period (`3 months`). Leave it out for reviews of any age.
          minLength: 1
          maxLength: 40
        reviewsKeyword:
          type: string
          description: >
            With `addOns.reviews`: only keep reviews that mention every keyword
            listed, one keyword per line. Leave it out for all reviews.
          minLength: 1
          maxLength: 100
        reviewerNames:
          type: boolean
          description: >
            With `addOns.reviews`: include who wrote each review. Collects
            personal data, so it needs `personalDataAttestation: true`. Not
            available for a search that reaches a country whose data protection
            law does not allow it (`add_on_unavailable_in_area`).
          default: false
        photosPerBusiness:
          type: integer
          description: >
            With `addOns.photos`: the most photos collected for each business. It
            sets the photo charge for each business that has photos (a higher
            number costs more), whatever the number that comes back.
          minimum: 1
          maximum: 100
          default: 5
        mergeDuplicateContacts:
          type: boolean
          description: >
            List a contact found at several listings of the same business once in
            your download. Changes the download only, never the charge.
          default: true
        personalDataAttestation:
          type: boolean
          description: >
            Set to `true` to confirm: "I confirm I have a lawful basis to collect
            and use personal contact data, and will comply with applicable privacy
            and anti-spam law." Required whenever `addOns.websiteContacts`,
            `addOns.decisionMakerLeads`, `addOns.socialProfiles` or
            `reviewerNames` is on; without it the request is rejected with `400`
            and `error: "invalid_request"`. It is recorded with each search that
            collects personal data, together with the version of this wording,
            just as when you tick the same box on the search form.
          default: false
        deliverTo:
          type: array
          description: >
            Webhook ids (from `GET /webhooks`) to send this search's
            `extraction.completed` event to when it finishes, in addition to
            every enabled webhook whose `deliveryMode` is `always`, which
            receive it anyway. Use it for a webhook created with
            `deliveryMode: "ask"`, which fires only for the searches that name
            it. Every id must be one of your webhooks: an id that is not,
            whether another account's or one that matches nothing, is rejected
            with `400` and `error: "unknown_webhook"`, and nothing is started.
            A paused webhook (`enabled: false`) is accepted and receives
            nothing while it is paused. An id named twice counts once.
          items:
            type: string
            format: uuid
          maxItems: 20

    AddOns:
      type: object
      additionalProperties: false
      description: >
        Extra data for each business, each off unless set to `true`. Each add-on
        costs credits on top of the business record, charged only for what it
        delivers; `POST /jobs/estimate` quotes a search with its add-ons.
      properties:
        websiteContacts:
          type: boolean
          description: >
            Emails and social media links found on each business's website.
            Charged for each email address delivered, up to
            `maxEmailsPerBusiness` per business, except where decision-maker
            leads already found an email for that business; a business with no
            email found costs nothing extra. Collects personal data, so it needs
            `personalDataAttestation: true`.
          default: false
        decisionMakerLeads:
          type: boolean
          description: >
            Named decision makers at each business, with their contact details
            where found, up to `maxLeadsPerBusiness` per business. Charged for
            each lead found. On such a search a business returned with no email
            costs less than one with an email, and one with neither email nor
            phone costs nothing. Collects personal data, so it needs
            `personalDataAttestation: true`. Not available for a search that
            reaches a country whose data protection law does not allow it
            (`add_on_unavailable_in_area`).
          default: false
        verifiedEmails:
          type: boolean
          description: >
            Checks each decision-maker lead's email and says whether it can
            receive mail. Off unless you ask for it, and only with
            `decisionMakerLeads`. Charged for each lead checked.
          default: false
        socialProfiles:
          type: boolean
          description: >
            Details from the social media profiles linked on each business's
            website. Needs `websiteContacts`. Charged for each profile delivered.
            Collects personal data, so it needs `personalDataAttestation: true`.
          default: false
        reviews:
          type: boolean
          description: >
            Reviews of each business, in a separate download, shaped by
            `reviewsPerBusiness` and the other review options. Charged for each
            business that has reviews, at a price set by `reviewsPerBusiness`.
          default: false
        photos:
          type: boolean
          description: >
            Photos of each business, up to `photosPerBusiness`. Charged for each
            business that has photos, at a price set by `photosPerBusiness`.
          default: false
        extraDetails:
          type: boolean
          description: >
            More from each business's listing: web results, reservation and
            online-ordering links, and questions and answers. Charged for each
            business.
          default: false

    GeoArea:
      type: object
      description: >
        A drawn search area as GeoJSON. Coordinates are [longitude, latitude]
        pairs. Mutually exclusive with `locationQuery`.
      required: [type, coordinates]
      properties:
        type:
          type: string
          enum: [Polygon, MultiPolygon]
        coordinates:
          description: >
            GeoJSON coordinate array. For `Polygon`: an array of linear rings
            (each an array of [lng, lat] positions). For `MultiPolygon`: an array
            of polygons.
          type: array
          items: {}
      additionalProperties: false

    StartSearchResponse:
      type: object
      required: [jobId, status]
      properties:
        jobId:
          type: string
          format: uuid
          description: Unique identifier for the search. Use it to match results later.
          example: "8f1d6c2a-3b4e-4f7a-9c1d-2e3f4a5b6c7d"
        status:
          type: string
          enum: [queued]
          description: Always "queued" on a successful start.
      example:
        jobId: "8f1d6c2a-3b4e-4f7a-9c1d-2e3f4a5b6c7d"
        status: "queued"

    SearchEstimate:
      type: object
      additionalProperties: false
      description: >
        What a search can hold and charge at most, from your credits right now.
        Every figure is a ceiling, never a promised price: a search is charged
        only for what it delivers. Credits are the same credits `capCredits` and
        `creditsCharged` count.
      required:
        - status
        - coveredByFreeCredits
        - freeCredits
        - maxCreditsHeld
        - maxCreditsCharged
        - maxBusinesses
        - maxCreditsPerBusiness
        - creditsNeeded
        - limitedBy
      properties:
        status:
          type: string
          enum: [ready, short, balance_unavailable]
          description: >
            `ready`: the search can start. `short`: the credits it may hold
            (`capCredits`, or your free credits) cannot cover one business per
            search term, so it would not start; raise `capCredits`, buy credits,
            or ask for fewer add-ons. `balance_unavailable`: your balance could
            not be read just now; every figure is null, and `POST /jobs` still
            checks your credits when you start.
        coveredByFreeCredits:
          type: ["boolean", "null"]
          description: >
            Whether the credits this search may hold cover the least it needs to
            start. Null when your balance could not be read.
        freeCredits:
          type: ["integer", "null"]
          minimum: 0
          description: Your free credits, your balance less what your running searches hold.
        maxCreditsHeld:
          type: ["integer", "null"]
          minimum: 0
          description: >
            The most this search would hold while it runs: `capCredits`, or all
            your free credits without one.
        maxCreditsCharged:
          type: ["integer", "null"]
          minimum: 0
          description: >
            The most this search can charge (null unless `ready`). It is charged
            only for what it delivers, so usually less.
        maxBusinesses:
          type: ["integer", "null"]
          minimum: 0
          description: The most businesses this search can return (null unless `ready`).
        maxCreditsPerBusiness:
          type: ["number", "null"]
          description: >
            The most one business can cost with the add-ons and options asked for
            (null unless `ready`). May be a half credit.
        creditsNeeded:
          type: ["integer", "null"]
          minimum: 0
          description: >
            On `short`: the least the search must be able to hold to start.
            Null otherwise.
        limitedBy:
          type: ["string", "null"]
          enum: [credits, max_results, per_search_limit, area, null]
          description: >
            Which limit sets `maxBusinesses` (null unless `ready`): `credits`
            (what the search may hold), `max_results` (your `maxResults`),
            `per_search_limit` (the most one search can return), or `area` (the
            most the search area can return).
      example:
        status: "ready"
        coveredByFreeCredits: true
        freeCredits: 1200
        maxCreditsHeld: 500
        maxCreditsCharged: 500
        maxBusinesses: 500
        maxCreditsPerBusiness: 1
        creditsNeeded: null
        limitedBy: "credits"

    SearchList:
      type: object
      required: [data, hasMore]
      properties:
        data:
          type: array
          description: Completed searches, newest first.
          items:
            $ref: "#/components/schemas/SearchSummary"
        hasMore:
          type: boolean
          description: >
            True when more completed searches matched than fit in `limit`: the
            page was truncated to the newest `limit`. Rare for a single account.
            To retrieve the remainder, repeat the call with a larger `limit` (max
            100) and the SAME `since`; only advance `since` to the newest
            `completedAt` you have seen once `hasMore` is false. Advancing `since`
            while `hasMore` is true would skip the older, un-returned searches.
            Results are de-duplicated by `jobId` regardless.

    SearchSummary:
      type: object
      required: [jobId, status, recordCount, creditsCharged, completedAt, downloads]
      description: >
        A finished search. Mirrors the fields delivered to outbound webhooks
        (Phase 23), the existing "completed search" payload.
      properties:
        jobId:
          type: string
          format: uuid
          description: Stable identifier. Use it as the de-duplication key when polling.
        status:
          type: string
          enum: [completed, incomplete]
          description: >
            `completed` for a search that covered the whole requested area (maps
            from the internal `complete` state). `incomplete` for a search that
            delivered results but could not cover part of the requested area; it
            was charged only for the records it delivered, and `recordCount` is
            what it delivered (maps from the internal `incomplete` state). Both
            are listed under the `completed` filter. Every other state
            (`queued`, `running`, `cancelled`, `failed`) is read with
            `GET /jobs/{id}` or `GET /jobs/history`.
        recordCount:
          type: integer
          description: Number of business records the search returned.
          minimum: 0
        creditsCharged:
          type: integer
          description: >
            Credits charged for this search (charge-on-success), a whole number:
            a business record costs 1 credit plus any add-ons, and the total is
            rounded down to a whole credit (at least 1 credit when the exact total
            is above 0), so this need not equal `recordCount`.
          minimum: 0
        completedAt:
          type: string
          format: date-time
          description: When the search finished (RFC 3339).
        downloads:
          description: >
            Ready-to-use download links, one per format. Each is a signed,
            time-limited URL (about 7 days) that needs no API key. Null if
            download links are unavailable for this search.
          oneOf:
            - $ref: "#/components/schemas/Downloads"
            - type: "null"
        summary:
          type: string
          description: >
            Short human-readable summary of the result. For an `incomplete`
            search it adds the sentence that says why part of the area is
            missing.
          example: "Your search finished with 142 records."
      example:
        jobId: "8f1d6c2a-3b4e-4f7a-9c1d-2e3f4a5b6c7d"
        status: "completed"
        recordCount: 142
        creditsCharged: 142
        completedAt: "2026-06-12T14:22:05Z"
        downloads:
          csv: "https://livemapleads.com/api/exports/download?token=eyJhbGciOi..."
          xlsx: "https://livemapleads.com/api/exports/download?token=eyJhbGciOi..."
          json: "https://livemapleads.com/api/exports/download?token=eyJhbGciOi..."
        summary: "Your search finished with 142 records."

    SearchStatus:
      type: string
      enum: [queued, running, completed, incomplete, cancelled, failed]
      description: >
        Where a search is. `queued`: accepted, not running yet. `running`:
        running, or being charged and delivered, or stopping after a cancel
        (`cancelRequested: true`). `completed`: it finished and delivered.
        `incomplete`: it delivered what it found but could not search part of
        the area; it was charged only for what it delivered. `cancelled`: it was
        stopped by a cancel. `failed`: it could not be completed; see `failure`.
        The last four are final.

    Search:
      type: object
      additionalProperties: false
      description: >
        One search, in any state. Fields that describe how it ended are null
        while it runs, and `progress` is null once it has ended.
      required:
        - jobId
        - status
        - cancelRequested
        - createdAt
        - settledAt
        - request
        - recordCount
        - creditsCharged
        - progress
        - finishReason
        - shortfall
        - failure
        - cancelRefundsInFull
        - downloads
      properties:
        jobId:
          type: string
          format: uuid
          description: The search's id, the `jobId` its start returned.
        status:
          $ref: "#/components/schemas/SearchStatus"
        cancelRequested:
          type: boolean
          description: >
            True while a cancel you asked for is stopping the search (`status` is
            still `running`). False otherwise, including once it has ended.
        createdAt:
          type: string
          format: date-time
          description: >
            When the search was created (RFC 3339). Not when it finished: no
            finish time is reported for a search that failed or was cancelled.
        settledAt:
          type: ["string", "null"]
          format: date-time
          description: >
            When the search was charged for what it delivered (RFC 3339), or null
            if it never was: while it runs, and for a search that failed or was
            cancelled with a full refund.
        request:
          description: >
            What the search asked for, or null when it can no longer be read.
          oneOf:
            - $ref: "#/components/schemas/SearchRequestEcho"
            - type: "null"
        recordCount:
          type: ["integer", "null"]
          minimum: 0
          description: >
            Business records the search delivered. Null until it has ended, and
            may be null or 0 for a search that failed, or that was cancelled
            with nothing delivered.
        creditsCharged:
          type: ["integer", "null"]
          minimum: 0
          description: >
            Credits charged for the search, a whole number (the same credits
            `capCredits` counts). Null until it is charged.
        progress:
          description: While the search is `queued` or `running`, how far it has got; null once it has ended.
          oneOf:
            - $ref: "#/components/schemas/SearchProgress"
            - type: "null"
        finishReason:
          type: ["string", "null"]
          enum:
            - target_reached
            - budget_reached
            - limit_reached
            - area_exhausted
            - area_partial
            - stopped
            - null
          description: >
            Why a search that delivered ended: `target_reached` (it found as many
            businesses as `maxResults` asked for), `budget_reached` (it stopped at
            the credits it could hold, `capCredits` or your free credits),
            `limit_reached` (it reached the most one search can return),
            `area_exhausted` (it found every business it could in the area),
            `area_partial` (part of the area could not be searched; `shortfall`
            says so), `stopped` (it was cancelled). Null while it runs, for a
            failed search, and when it is not known.
        shortfall:
          type: ["string", "null"]
          description: >
            When the search delivered less than it asked for, or left businesses
            out, the sentences that say why, as one paragraph (the same words
            the app shows). Null when there is nothing to say.
          example: "We delivered 140 of the 200 businesses you asked for. Because of a problem on our side, we couldn't search part of the area you picked, so some businesses there may be missing from your list."
        failure:
          description: Why a `failed` search failed; null for every other status.
          oneOf:
            - $ref: "#/components/schemas/SearchFailure"
            - type: "null"
        cancelRefundsInFull:
          type: boolean
          description: >
            What a cancel does to this search. `false`: a cancelled search keeps
            what it already found, delivers it and is charged for it. `true`: a
            cancelled search delivers nothing and is refunded in full.
        downloads:
          description: >
            Download links for a search that ended and delivered results
            (`completed`, `incomplete`, or `cancelled` with what it kept), while
            its files are kept; null otherwise. The same signed, time-limited
            links as on `GET /jobs`.
          oneOf:
            - $ref: "#/components/schemas/Downloads"
            - type: "null"
      example:
        jobId: "8f1d6c2a-3b4e-4f7a-9c1d-2e3f4a5b6c7d"
        status: "completed"
        cancelRequested: false
        createdAt: "2026-06-12T14:02:11Z"
        settledAt: "2026-06-12T14:22:05Z"
        request:
          searchTerms: ["dentist"]
          location: "Austin, TX"
          addOns:
            websiteContacts: true
            decisionMakerLeads: false
            verifiedEmails: false
            socialProfiles: false
            reviews: false
            photos: false
            extraDetails: false
        recordCount: 142
        creditsCharged: 160
        progress: null
        finishReason: "area_exhausted"
        shortfall: null
        failure: null
        cancelRefundsInFull: false
        downloads:
          csv: "https://livemapleads.com/api/exports/download?token=eyJhbGciOi..."
          xlsx: "https://livemapleads.com/api/exports/download?token=eyJhbGciOi..."
          json: "https://livemapleads.com/api/exports/download?token=eyJhbGciOi..."

    SearchRequestEcho:
      type: object
      additionalProperties: false
      required: [searchTerms, location, addOns]
      description: What a search asked for.
      properties:
        searchTerms:
          type: array
          items:
            type: string
          description: The search terms, as sent.
        location:
          type: string
          description: >
            The place searched: the `locationQuery` as sent, the name of the place
            a drawn area was made from, or "Custom map area" for a drawn area.
        addOns:
          $ref: "#/components/schemas/AddOnsEcho"

    AddOnsEcho:
      type: object
      additionalProperties: false
      description: Which add-ons the search asked for, by the names `addOns` takes on a start.
      required:
        - websiteContacts
        - decisionMakerLeads
        - verifiedEmails
        - socialProfiles
        - reviews
        - photos
        - extraDetails
      properties:
        websiteContacts:
          type: boolean
        decisionMakerLeads:
          type: boolean
        verifiedEmails:
          type: boolean
        socialProfiles:
          type: boolean
        reviews:
          type: boolean
        photos:
          type: boolean
        extraDetails:
          type: boolean

    SearchProgress:
      type: object
      additionalProperties: false
      required: [elapsedSeconds, expectedBusinesses, usualMinutes]
      description: >
        How far a search that is still `queued` or `running` has got. A time and
        a ceiling, never a count of what it has found so far.
      properties:
        elapsedSeconds:
          type: integer
          minimum: 0
          description: Whole seconds since the search was created, by our clock.
        expectedBusinesses:
          type: ["integer", "null"]
          minimum: 0
          description: >
            The most businesses the search aims for, or null until it has been
            planned.
        usualMinutes:
          description: >
            How long a search like this usually takes, as a range of whole
            minutes, or null when there is no estimate for it.
          oneOf:
            - type: object
              additionalProperties: false
              required: [low, high]
              properties:
                low:
                  type: integer
                  minimum: 0
                high:
                  type: integer
                  minimum: 0
            - type: "null"

    SearchFailure:
      type: object
      additionalProperties: false
      required: [code, message]
      description: Why a search failed. Branch on `code`; `message` is for people.
      properties:
        code:
          type: string
          enum: [search_failed, search_timed_out]
          description: >
            `search_failed`: the search could not be completed. `search_timed_out`:
            it ran longer than a search may run and was stopped. Either way it
            delivered nothing and was not charged; you can start it again.
        message:
          type: string
          example: "The search could not be completed, so it delivered nothing and you were not charged for it. Start it again, or contact support if it keeps failing."

    SearchHistory:
      type: object
      additionalProperties: false
      required: [data, nextCursor]
      properties:
        data:
          type: array
          description: Searches, newest created first.
          items:
            $ref: "#/components/schemas/Search"
        nextCursor:
          type: ["string", "null"]
          description: >
            Pass it as `cursor` to get the next page; null when this page is the
            last.
          example: "MjAyNi0wNi0xMlQxNDowMjoxMVo"

    Downloads:
      type: object
      description: >
        Signed, time-limited download URLs by format. No API key needed to fetch.
        `csv`/`xlsx`/`json` are the main business list. `reviews-csv`/`reviews-xlsx`
        are present ONLY when the search ran the Reviews add-on AND reviews were
        returned: a separate file, one row per review joined to its business.
      properties:
        csv:
          type: string
          format: uri
        xlsx:
          type: string
          format: uri
          description: >
            Business list (Excel). Usually one workbook. A large search that is
            collected in batches and delivers more than 25,000 records downloads
            a `.zip` archive instead (`application/zip`), holding several Excel
            workbooks of up to 25,000 rows each, in delivery order. The `csv`
            and `json` downloads are always a single file.
        json:
          type: string
          format: uri
        reviews-csv:
          type: string
          format: uri
          description: Reviews list (CSV). Present only for a Reviews-add-on search that returned reviews.
        reviews-xlsx:
          type: string
          format: uri
          description: Reviews list (Excel). Present only for a Reviews-add-on search that returned reviews.
      additionalProperties: false

    Webhook:
      type: object
      additionalProperties: false
      description: >
        One of your webhooks. The signing secret is never part of it: it is
        shown once, when the webhook is created and each time it is rotated.
      required:
        - id
        - label
        - url
        - enabled
        - deliveryMode
        - createdAt
        - lastDeliveryAt
        - lastDeliveryStatus
        - failureCount
        - secretLast4
      properties:
        id:
          type: string
          format: uuid
        label:
          type: ["string", "null"]
          description: Your name for it, or null.
        url:
          type: string
          format: uri
          description: Where events are sent.
        enabled:
          type: boolean
          description: False while paused. A paused webhook receives no events.
        deliveryMode:
          $ref: "#/components/schemas/DeliveryMode"
        createdAt:
          type: string
          format: date-time
        lastDeliveryAt:
          type: ["string", "null"]
          format: date-time
          description: When the last event or test was sent to it, or null if none has been.
        lastDeliveryStatus:
          type: ["string", "null"]
          description: >
            What the last delivery or test got: the HTTP status your endpoint
            answered with (`"200"`), or a short reason it could not be reached
            (`"error: blocked url"`, `"error: dns lookup failed"`, or
            `"error: "` and the error's name, such as `"error: TimeoutError"`).
            Null if nothing has been sent.
        failureCount:
          type: integer
          minimum: 0
          description: Failed deliveries in a row; back to 0 after one that succeeds. Tests do not count.
        secretLast4:
          type: string
          description: The last four characters of the signing secret, to tell secrets apart.
      example:
        id: "3c9e2f4a-7b1d-4e8a-a6c5-1d2e3f4a5b6c"
        label: "CRM import"
        url: "https://hooks.example.com/live-map-leads"
        enabled: true
        deliveryMode: "always"
        createdAt: "2026-06-10T09:15:00Z"
        lastDeliveryAt: "2026-06-12T14:22:07Z"
        lastDeliveryStatus: "200"
        failureCount: 0
        secretLast4: "k9Qz"

    DeliveryMode:
      type: string
      enum: [always, ask]
      description: >
        `always`: receives the event of every search that finishes and delivers
        results. `ask`: receives it only for searches that name the webhook in
        `deliverTo` (and when you send one again with `POST /jobs/{id}/deliver`).

    WebhookList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          description: Your webhooks, newest first.
          items:
            $ref: "#/components/schemas/Webhook"

    CreateWebhookRequest:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url:
          type: string
          description: >
            Where to send events: an `https://` URL that reaches a public
            address.
          minLength: 1
          maxLength: 2048
          example: "https://hooks.example.com/live-map-leads"
        label:
          type: string
          description: A name to tell it apart.
          maxLength: 80
        deliveryMode:
          $ref: "#/components/schemas/DeliveryMode"
          default: always

    UpdateWebhookRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Only the fields sent are changed; send at least one.
      example:
        label: "CRM import"
      properties:
        url:
          type: string
          description: A new destination, checked as on create.
          minLength: 1
          maxLength: 2048
        label:
          type: ["string", "null"]
          description: A new name, or null to remove it.
          maxLength: 80
        enabled:
          type: boolean
          description: False pauses the webhook; true turns it back on.
        deliveryMode:
          $ref: "#/components/schemas/DeliveryMode"
        rotateSecret:
          type: boolean
          enum: [true]
          description: >
            Replace the signing secret. The answer carries the new one, shown
            this once; events are signed with it from now on.

    WebhookCreated:
      type: object
      additionalProperties: false
      required: [webhook, secret]
      properties:
        webhook:
          $ref: "#/components/schemas/Webhook"
        secret:
          type: string
          description: >
            The signing secret, shown only in this answer. Keep it to verify
            events.
          example: "YOUR_SIGNING_SECRET"

    WebhookUpdated:
      type: object
      additionalProperties: false
      required: [webhook]
      properties:
        webhook:
          $ref: "#/components/schemas/Webhook"
        secret:
          type: string
          description: >
            The new signing secret, present only when this request set
            `rotateSecret: true`, and shown only here.
          example: YOUR_NEW_SIGNING_SECRET

    WebhookTestResult:
      type: object
      additionalProperties: false
      required: [delivered, status]
      properties:
        delivered:
          type: boolean
          description: True when your endpoint answered with a 2xx status.
        status:
          type: string
          description: >
            The HTTP status your endpoint answered with (`"200"`), or a short
            reason it could not be reached (`"error: blocked url"`,
            `"error: dns lookup failed"`, `"error: TimeoutError"`).
      example:
        delivered: true
        status: "200"

    RedeliverSearchRequest:
      type: object
      additionalProperties: false
      required: [webhookIds]
      properties:
        webhookIds:
          type: array
          description: >
            The webhooks to send the event to, each one of yours. An id named
            twice counts once.
          items:
            type: string
            format: uuid
          minItems: 1
          maxItems: 20

    RecordPreview:
      type: object
      additionalProperties: false
      required: [records, skipped, truncated]
      properties:
        records:
          type: array
          maxItems: 100
          description: >
            The first records of the search, in its JSON download's order, each
            exactly as the download has it (the same fields as a record of the
            JSON file: which ones a record carries depends on the add-ons the
            search ran with).
          items:
            type: object
            additionalProperties: true
        skipped:
          type: integer
          minimum: 0
          description: >
            Records passed over because each is larger than 512 KiB. They are
            in the download.
        truncated:
          type: boolean
          description: >
            True when a size bound stopped the read before `limit` records or
            the end of the results; `records` holds those read before it.
      example:
        records:
          - name: "Lakeway Family Dentistry"
            address: "1700 Ranch Rd 620 S, Lakeway, TX 78734"
            phone: "+1 512-555-0142"
            website: "https://lakewayfamilydentistry.example"
            rating: 4.8
            reviewsCount: 312
            category: "Dentist"
            googleMapsUrl: "https://www.google.com/maps/place/?q=place_id:ChIJexample"
            latitude: 30.3427
            longitude: -97.9686
        skipped: 0
        truncated: false

    Redelivery:
      type: object
      additionalProperties: false
      required: [delivered, failed, requested]
      properties:
        delivered:
          type: integer
          minimum: 0
          description: Webhooks whose endpoint accepted the event (a 2xx answer).
        failed:
          type: integer
          minimum: 0
          description: Webhooks whose endpoint did not accept it, or could not be reached.
        requested:
          type: integer
          minimum: 1
          description: >
            Webhooks named. Those in neither `delivered` nor `failed` were
            paused and sent nothing.
      example:
        delivered: 1
        failed: 0
        requested: 1

    SearchCompletedEvent:
      type: object
      required: [event, jobId, recordCount, creditsCharged, completedAt, status, downloads, summary]
      description: >
        The body of the `extraction.completed` event. Branch on `event`; new
        fields may be added.
      properties:
        event:
          type: string
          enum: [extraction.completed]
        jobId:
          type: string
          format: uuid
          description: The search's id, as its start returned it. De-duplicate on it to act once per search.
        recordCount:
          type: integer
          minimum: 0
          description: Business records delivered.
        creditsCharged:
          type: integer
          minimum: 0
          description: Credits the search was charged, in the credits `capCredits` uses.
        completedAt:
          type: string
          format: date-time
          description: >
            When this event was sent (RFC 3339), not when the search ended: an
            event sent again with `POST /jobs/{id}/deliver` carries the time it
            was sent again.
        status:
          type: string
          enum: [complete, incomplete, aborted]
          description: >
            How the search ended, in the event's own words (not `SearchStatus`).
            `complete`: it finished. `incomplete`: it delivered what it found but
            could not search part of the area. `aborted`: it was cancelled and
            delivered what it had found.
        downloads:
          oneOf:
            - $ref: "#/components/schemas/Downloads"
            - type: "null"
          description: >
            Download links, each working for 7 days after the event is sent.
            Null when links could not be made; read the search with
            `GET /jobs/{id}` for them.
        summary:
          type: string
          description: One sentence describing the result, for people. Do not parse it.
          example: "Your extraction is complete. 120 records are ready to download."
        redelivered:
          type: boolean
          enum: [true]
          description: >
            Present, and true, only on an event sent again with
            `POST /jobs/{id}/deliver`.
      example:
        event: "extraction.completed"
        jobId: "8f1d6c2a-3b4e-4f7a-9c1d-2e3f4a5b6c7d"
        recordCount: 120
        creditsCharged: 120
        completedAt: "2026-11-14T15:04:05.000Z"
        status: "complete"
        downloads:
          csv: "https://livemapleads.com/api/exports/download?token=eyJhbGciOi..."
          xlsx: "https://livemapleads.com/api/exports/download?token=eyJhbGciOi..."
          json: "https://livemapleads.com/api/exports/download?token=eyJhbGciOi..."
        summary: "Your extraction is complete. 120 records are ready to download."

    WebhookTestEvent:
      type: object
      required: [event, message, sentAt]
      description: The body of a test event.
      properties:
        event:
          type: string
          enum: [webhook.test]
        message:
          type: string
          description: A sentence saying this is a test.
        sentAt:
          type: string
          format: date-time
      example:
        event: "webhook.test"
        message: "This is a test event from Live Map Leads."
        sentAt: "2026-06-12T14:30:00Z"

    Account:
      type: object
      additionalProperties: false
      description: >
        Your credits, your running searches, and the key you are calling with.
        Credits are the same credits `capCredits` and `creditsCharged` count.
      required: [credits, runningSearches, key]
      properties:
        credits:
          type: object
          additionalProperties: false
          required: [free, held, balance]
          properties:
            free:
              type: integer
              minimum: 0
              description: >
                Credits a new search can use now: your balance less what your
                running searches hold.
            held:
              type: integer
              minimum: 0
              description: >
                Credits your running searches hold between them. A search is
                charged only for what it delivers, and the rest is released
                when it ends.
            balance:
              type: integer
              minimum: 0
              description: Every credit you own, `free` plus `held`.
        runningSearches:
          type: object
          additionalProperties: false
          required: [count, limit, heavySlotFree]
          properties:
            count:
              type: integer
              minimum: 0
              description: How many of your searches are running now.
            limit:
              type: integer
              minimum: 1
              description: The most searches you can run at once.
            heavySlotFree:
              type: boolean
              description: >
                True when none of your running searches collects emails or
                extra details, so a search that does can start (when `count` is
                also below `limit`). Only one such search runs at a time.
        key:
          type: object
          additionalProperties: false
          required: [name, permission]
          properties:
            name:
              type: ["string", "null"]
              description: The name the key was given when it was created.
            permission:
              type: string
              enum: [full, read, custom]
              description: >
                `full`: it may read and change everything, including starting
                searches. `read`: it may only read. `custom`: a set of
                permissions that is neither; account settings never create
                one.
      example:
        credits:
          free: 1200
          held: 300
          balance: 1500
        runningSearches:
          count: 1
          limit: 3
          heavySlotFree: true
        key:
          name: "Zapier"
          permission: "full"

    CategoryList:
      type: object
      additionalProperties: false
      required: [version, total, categories]
      properties:
        version:
          type: string
          description: >
            The list's version. It changes whenever the list does, whatever
            `q` and `limit` were.
          example: "3f2a9c0e71b4d5a8"
        total:
          type: integer
          minimum: 0
          description: How many categories matched, before `limit`.
        categories:
          type: array
          description: >
            The matching category names, each exactly as `POST /jobs` accepts
            it in `categories`.
          items:
            type: string
          example: ["dentist", "dental clinic", "cosmetic dentist"]
    Error:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          description: Stable machine-readable error code.
          example: "invalid_request"
        message:
          type: string
          description: Human-readable explanation. Do not parse it; read `error`.
