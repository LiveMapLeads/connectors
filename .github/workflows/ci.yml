# Per-package gate on every PR / push to main. Path-filtered so a package's CI only runs
# when that package changes (this repo holds independently-released connectors).
name: CI

on:
  push:
    branches: [main]
    paths:
      - 'activepieces/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'activepieces/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  activepieces:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: activepieces
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: activepieces/package-lock.json
      - run: npm ci
      # typecheck (sources + tests) + eslint + vitest (mocked, no credits) + build.
      - run: npm run check
